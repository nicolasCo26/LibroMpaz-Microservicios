spring.application.name=ms-anotaciones
server.port=8082

# Base de datos H2 en archivo: los datos quedan en ./data y sobreviven al reinicio.
spring.datasource.url=jdbc:h2:file:./data/anotaciones;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea o actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola cada SQL que se ejecuta (sirve para ver la persistencia en vivo).
spring.jpa.show-sql=true

# Consola web de la base: http://localhost:8082/h2-console (JDBC URL de arriba, usuario sa).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
